name: publish

# Publishes the DotnetMatplotlib NuGet package when a version tag is pushed,
# e.g. `git tag v0.0.1 && git push origin v0.0.1`.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write # required to publish to GitHub Packages

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify NuGet token
        run: |
          if [ -z "${{ secrets.NUGET_TOKEN }}" ]; then
            echo "Error: NUGET_TOKEN secret is not set"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore src/Matplotlib/Matplotlib.fsproj
          dotnet restore src/Matplotlib.Interactive/Matplotlib.Interactive.fsproj
          dotnet restore src/Matplotlib.Mcp/Matplotlib.Mcp.fsproj
          dotnet restore src/Matplotlib.DataFrame/Matplotlib.DataFrame.fsproj
          dotnet restore src/Matplotlib.Reports/Matplotlib.Reports.fsproj

      # pack builds and packs in one step. We do NOT pass --no-build: the
      # single-package bundling target (CopyProjectReferencesToPackage) resolves
      # the referenced projects' outputs, which a --no-build pack would re-invoke
      # the Build target for, failing with NETSDK1085.
      - name: Pack
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Packing version $VERSION"
          dotnet pack src/Matplotlib/Matplotlib.fsproj -c Release --no-restore --output . -p:Version=$VERSION
          dotnet pack src/Matplotlib.Interactive/Matplotlib.Interactive.fsproj -c Release --no-restore --output . -p:Version=$VERSION
          dotnet pack src/Matplotlib.Mcp/Matplotlib.Mcp.fsproj -c Release --no-restore --output . -p:Version=$VERSION
          dotnet pack src/Matplotlib.DataFrame/Matplotlib.DataFrame.fsproj -c Release --no-restore --output . -p:Version=$VERSION
          dotnet pack src/Matplotlib.Reports/Matplotlib.Reports.fsproj -c Release --no-restore --output . -p:Version=$VERSION

      - name: Push to nuget.org
        env:
          TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          dotnet nuget push *.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${TOKEN}" \
            --skip-duplicate

      # Also publish to this repository's GitHub Packages NuGet feed. GITHUB_TOKEN
      # is provided automatically and authorized by `permissions: packages: write`.
      - name: Push to GitHub Packages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push *.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${TOKEN}" \
            --skip-duplicate
